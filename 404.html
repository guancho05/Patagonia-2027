<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>No existe esa página · Patagonia 2027</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131A22">
<link rel="icon" href="/img/icono.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark;--fondo:#F2F6F9;--texto:#131A22;--texto-2:#46596A;--linea:#CBD8E2;--polar:#9D2F23}
@media (prefers-color-scheme:dark){:root{--fondo:#131A22;--texto:#F2F6F9;--texto-2:#A9BCCB;--linea:#34424F}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--fondo);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:34rem}
svg{display:block;width:100%;height:auto;margin-bottom:20px}
p.k{font:500 12px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-2);margin:0 0 8px}
h1{font:700 clamp(2.25rem,9vw,3.5rem)/1 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:0 0 12px}
p{margin:0 0 20px}
nav{display:flex;flex-wrap:wrap;gap:8px}
a{min-height:44px;display:inline-flex;align-items:center;padding:8px 14px;border:1.5px solid var(--texto);border-radius:3px;color:var(--texto);text-decoration:none;font-weight:700}
a:hover{background:var(--texto);color:var(--fondo)}
a.p{background:var(--polar);border-color:var(--polar);color:#fff}
a:focus-visible{outline:3px solid #6CC2DB;outline-offset:2px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 520 120" aria-hidden="true" fill="none"><path d="M10 100c60-6 80-50 130-56s70 40 120 34 60-58 110-62 80 30 140 20" stroke="var(--polar)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/><circle cx="10" cy="100" r="8" fill="var(--polar)"/><path d="m492 22 16 16m0-16-16 16" stroke="var(--texto)" stroke-width="5" stroke-linecap="round"/></svg>
  <p class="k">Error 404</p>
  <h1>Este sendero no está en el mapa</h1>
  <p>La dirección no existe o cambió. El plan del viaje está todo en la página principal.</p>
  <nav aria-label="Secciones">
    <a class="p" href="/">Ir a la portada</a>
    <a href="/#itinerario">Itinerario</a>
    <a href="/#mapa">Mapa</a>
    <a href="/#casas">Casas</a>
    <a href="/#gastos">Gastos</a>
  </nav>
</main>
</body>
</html>
